name: ci
on: [push, pull_request]
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      # rake's default task is the suite; naming files here left six of them unrun
      - name: suite
        run: rake
